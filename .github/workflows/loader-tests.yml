name: Loader tests

on:
  pull_request:
    paths:
      - ".github/workflows/loader-tests.yml"
      - "salim/services/loader/**"
      - "salim/shared/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/loader-tests.yml"
      - "salim/services/loader/**"
      - "salim/shared/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salim
          POSTGRES_PASSWORD: salim
          POSTGRES_DB: salim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salim -d salim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salim/services/loader/requirements.txt

      - name: Install loader dependencies
        run: python -m pip install --requirement salim/services/loader/requirements.txt

      # Migration history vs models, adoption of a pre-Alembic database, RLS.
      - name: Run shared schema tests against Postgres
        working-directory: salim
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+psycopg2://salim:salim@localhost:5432/salim_test
        run: python -m unittest discover --start-directory shared/tests --top-level-directory . --verbose

      - name: Run loader tests against Postgres
        working-directory: salim/services/loader
        env:
          PYTHONPATH: ../..
          TEST_DATABASE_URL: postgresql+psycopg2://salim:salim@localhost:5432/salim_test
        run: python -m unittest discover --start-directory tests --top-level-directory . --verbose
