services:
  # --- infra (local stand-ins for the cloud services) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salim
      POSTGRES_PASSWORD: salim
      POSTGRES_DB: salim
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  shared-s3-integration:
    profiles: ["integration"]
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r salim/shared/requirements.txt &&
      python -m unittest salim.shared.tests.test_s3_integration -v"
    environment:
      MINIO_INTEGRATION_ENDPOINT: http://minio:9000
      MINIO_INTEGRATION_ACCESS_KEY: minioadmin
      MINIO_INTEGRATION_SECRET_KEY: minioadmin
      MINIO_INTEGRATION_REGION: us-east-1
    volumes:
      - ..:/app
    depends_on:
      - minio

  # --- application services ---
  crawler:
    build:
      context: ./crawler
    env_file: .env.example
    depends_on:
      - minio

