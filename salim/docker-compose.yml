services:
  # --- infra (local stand-ins for the cloud services) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salim
      POSTGRES_PASSWORD: salim
      POSTGRES_DB: salim
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # --- application services ---
  crawler:
    build:
      context: ./crawler
    env_file: .env.example
    depends_on:
      - minio

  # extractor:
  #   build:
  #     context: .
  #     dockerfile: services/extractor/Dockerfile
  #   env_file: .env.example
  #   depends_on:
  #     - minio
  #     - rabbitmq

  loader:
    build:
      context: .
      dockerfile: services/loader/Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped

  # Same image, run on demand: `docker compose run --rm loader-enrich`.
  # Resolves manufacturers for products the free tiers could not, via the LLM.
  loader-enrich:
    build:
      context: .
      dockerfile: services/loader/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["python", "enrich.py", "--backfill"]
    depends_on:
      - postgres
    profiles: ["enrich"]

  # api:
  #   build:
  #     context: .
  #     dockerfile: api/Dockerfile
  #   env_file: .env.example
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres

volumes:
  postgres-data:
  minio-data:
