server {
  listen 80;
  root /usr/share/nginx/html;

  # /api is proxied here too, so a container build needs no CORS and no
  # VITE_API_BASE_URL: the UI and the API share this origin.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  # Client-side routes such as /products/gtin:729... have no file on disk.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
